name: Make Insta Automation AI videos
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: one video id (e.g. v1_profile_makeover). Empty = all 4"
        required: false
        default: ""
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg libraqm0
          pip install -r requirements.txt
      - name: Render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Orus' }}
          IAA_HANDLE: ${{ vars.IAA_HANDLE }}
        run: python make.py ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: iaa-videos
          path: output/
