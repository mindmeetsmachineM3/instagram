name: IAA auto-post
# 4 posts a day: 09:00, 12:30, 17:00, 20:30 IST = reel, reel, carousel, reel. Edit the cron lines to change times.
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 7 * * *"
    - cron: "30 11 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the video but do NOT post (use for the first test)"
        type: boolean
        default: true
      force:
        description: "Optional: post this type now"
        type: choice
        default: ""
        options: ["", reel, carousel]
      diagnose:
        description: "Only check the Instagram token and quota"
        type: boolean
        default: false
concurrency:
  group: iaa-post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Orus' }}
      IAA_HANDLE: ${{ vars.IAA_HANDLE }}
      IAA_TTS: ${{ vars.IAA_TTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg libraqm0
          pip install -r requirements.txt
      - name: Diagnose
        if: ${{ inputs.diagnose }}
        run: python post.py --diagnose
      - name: Make and post
        if: ${{ !inputs.diagnose }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.force }}" ]; then ARGS="$ARGS --force ${{ inputs.force }}"; fi
          python post.py $ARGS
      - name: Save state
        if: ${{ success() && !inputs.diagnose && inputs.dry_run != true }}
        run: |
          git config user.name "iaa-bot"; git config user.email "iaa-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "state"; git pull --rebase origin "${{ github.ref_name }}" || true; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: output/
          retention-days: 7
          if-no-files-found: ignore
